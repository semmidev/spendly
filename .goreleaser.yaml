# .goreleaser.yaml
# Production release configuration for Spendly using GoReleaser v2
version: 2

project_name: spendly

before:
  hooks:
    - go mod tidy

builds:
  - id: spendly
    main: ./cmd/api
    binary: spendly
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -extldflags '-static'
      - -X github.com/semmidev/spendly/internal/platform/config.Version={{.Version}}
      - -X github.com/semmidev/spendly/internal/platform/config.BuildTime={{.Date}}
      - -X github.com/semmidev/spendly/internal/platform/config.GitCommit={{.Commit}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - compose.yml
      - .env.example

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "merge conflict"
      - Merge pull request
      - Merge branch
  groups:
    - title: "🚀 Features"
      regexp: '^feat[(\w\s)]*:'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^fix[(\w\s)]*:'
      order: 1
    - title: "⚡ Performance & Refactoring"
      regexp: '^(perf|refactor)[(\w\s)]*:'
      order: 2
    - title: "🛠️ Maintenance & Infrastructure"
      regexp: '^(build|ci|chore)[(\w\s)]*:'
      order: 3
    - title: "📋 Documentation"
      regexp: '^docs[(\w\s)]*:'
      order: 4
    - title: "📦 Others"
      order: 999

release:
  github:
    owner: semmidev
    name: spendly
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## 📦 Spendly Release {{ .Version }} ({{ .Date }})

    Binary Spendly API dengan React SPA ter-embed — pelacak pengeluaran.

  footer: |
    ---
    *Automated release generated by [GoReleaser](https://goreleaser.com) & GitHub Actions.*
